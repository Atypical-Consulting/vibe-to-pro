<!doctype html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  *{box-sizing:border-box;margin:0;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    background:#0E1213; color:#E7ECE4; font-family:'IBM Plex Sans',sans-serif;
    display:flex; flex-direction:column; justify-content:center; padding:80px;
    position:relative;
  }
  body::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 85% 15%, rgba(92,192,172,.18), transparent 55%);
  }
  .eyebrow{ font-family:'IBM Plex Mono'; font-size:22px; letter-spacing:.08em; text-transform:uppercase; color:#5CC0AC; display:flex; align-items:center; gap:14px; z-index:1; }
  .eyebrow::before{ content:"›_"; font-weight:700; }
  h1{ font-family:'IBM Plex Serif'; font-weight:700; font-size:64px; line-height:1.12; margin:26px 0 22px; max-width:900px; z-index:1; }
  p{ font-size:24px; color:#A6ACA6; max-width:820px; line-height:1.5; z-index:1; }
  .stats{ display:flex; gap:48px; margin-top:44px; z-index:1; }
  .stat b{ font-family:'IBM Plex Serif'; font-size:38px; color:#E7ECE4; display:block; }
  .stat span{ font-family:'IBM Plex Mono'; font-size:14px; color:#767D77; text-transform:uppercase; letter-spacing:.05em; }
</style></head>
<body>
  <span class="eyebrow">Cours de terrain — Claude Code</span>
  <h1>Le vibe‑coding s'arrête où commence le contrôle.</h1>
  <p>385 versions du CHANGELOG officiel analysées. Chaque fait vérifié contre la documentation actuelle avant d'être enseigné.</p>
  <div class="stats">
    <div class="stat"><b>385</b><span>versions analysées</span></div>
    <div class="stat"><b>395</b><span>faits vérifiés</span></div>
    <div class="stat"><b>14</b><span>modules</span></div>
  </div>
</body></html>
